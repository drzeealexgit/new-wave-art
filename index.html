      ${bi(t('admin.cardDesc'), `site.cards[${k}].desc`, c.desc, true)}
      <div class="fld"><span class="fld-l">${esc(t('admin.cardSection'))}</span>
        <select class="in" data-path="site.cards[${k}].section">${opts}</select></div>
      <button type="button" class="btn btn-ghost btn-sm" data-upl="single" data-path="site.cards[${k}].image">↑ ${esc(t('admin.uploadImages'))}</button></div>`;
  }).join('');
  const arch = (DATA.site.archive.photos || []).map((p, k) =>
    `<div class="thumb"><img src="${srcOf(p)}" alt=""><div class="th-ops">
      <button type="button" data-act="arch-del" data-k="${k}" title="${esc(t('admin.delete'))}">✕</button></div></div>`).join('');
  return `<div class="adm-note">${esc(t('admin.langFields'))}</div>
  <div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(t('admin.homeHero'))}</span></div>
    ${mono(t('admin.heroName'), 'site.hero.name.' + LANG, tt({ v: h.name[LANG] }) || h.name[LANG])}
    ${bi(t('admin.heroRole'), 'site.hero.role', h.role)}
    ${bi(t('admin.heroAbout'), 'site.hero.about', h.about)}
    ${bi(t('admin.heroPull'), 'site.hero.pull', h.pull)}
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      ${h.image && srcOf(h.image) ? `<img class="thumb" style="width:64px;height:64px;object-fit:cover" src="${srcOf(h.image)}" alt="">` : ''}
      <button type="button" class="btn btn-ghost btn-sm" data-upl="single" data-path="site.hero.image">↑ ${esc(t('admin.uploadImages'))}</button></div>
  </div>
  <div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(t('admin.statementParas'))}</span></div>
    ${stmt}<button type="button" class="btn btn-ghost btn-sm" data-act="stmt-add">+ ${esc(t('admin.addParagraph'))}</button></div>
  <div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(t('admin.cards'))}</span></div>
    ${cards}<button type="button" class="btn btn-ghost btn-sm" data-act="card-add">+ ${esc(t('admin.cards'))}</button></div>
  <div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(t('admin.archive'))}</span></div>
    <div class="thumbs">${arch}</div>
    <button type="button" class="btn btn-ghost btn-sm" data-upl="list" data-path="site.archive.photos">↑ ${esc(t('admin.uploadImages'))}</button></div>`;
}

/* ---------- cv + contacts tabs ---------- */
function tabCV() {
  const groups = DATA.cv.groups.map((g, gi) => {
    const items = (g.items || []).map((it, ii) =>
      `<div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(it.year)} · ${esc(tt(it.what) || '—')}</span>
        ${btns([UP('cvi-up', { gi, ii }), DN('cvi-down', { gi, ii }), DEL('cvi-del', { gi, ii })])}</div>
        ${mono(t('admin.itemYear'), `cv.groups[${gi}].items[${ii}].year`, it.year)}
        ${bi(t('admin.itemWhat'), `cv.groups[${gi}].items[${ii}].what`, it.what)}
        ${bi(t('admin.itemPlace'), `cv.groups[${gi}].items[${ii}].place`, it.place)}
        ${bi(t('admin.itemDetail'), `cv.groups[${gi}].items[${ii}].detail`, it.detail)}</div>`).join('');
    return `<div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(tt(g.title))}</span>
      ${btns([UP('cvg-up', { gi }), DN('cvg-down', { gi }), DEL('cvg-del', { gi })])}</div>
      ${bi(t('admin.groupTitle'), `cv.groups[${gi}].title`, g.title)}
      ${items}<button type="button" class="btn btn-ghost btn-sm" data-act="cvi-add" data-gi="${gi}">+ ${esc(t('admin.addItem'))}</button></div>`;
  }).join('');
  return `${mono(t('admin.heroName'), 'cv.name.' + LANG, DATA.cv.name[LANG])}
    ${groups}<button type="button" class="btn btn-ghost btn-sm" data-act="cvg-add">+ ${esc(t('admin.addGroup'))}</button>`;
}
function tabContacts() {
  const c = DATA.contacts;
  return `${bi(t('admin.contactsCity'), 'contacts.city', c.city)}
    ${mono(t('admin.contactsEmail'), 'contacts.email', c.email)}
    ${mono(t('admin.contactsInstagram'), 'contacts.instagram', c.instagram)}
    ${mono(t('admin.contactsInstagramUrl'), 'contacts.instagramUrl', c.instagramUrl)}`;
}
function storageBytes() {
  return (store.get(LS_DATA) || '').length + (store.get(LS_UPLOADS) || '').length;
}
function tabSettings() {
  const used = storageBytes();
  const pct = Math.min(100, Math.round(used / (4.5 * 1024 * 1024) * 100));
  return `<div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(t('admin.settingsPassword'))}</span></div>
    <div class="row23">${mono(t('admin.newPassword'), 'adm-newpw', '')}
      <button type="button" class="btn" data-act="pw-change" style="align-self:end;height:42px">OK</button></div></div>
  <div class="adm-card"><div class="ac-head"><span class="ac-title">JSON</span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button type="button" class="btn" data-act="export">↓ ${esc(t('admin.export'))}</button>
      <button type="button" class="btn btn-ghost" data-act="import-btn">↑ ${esc(t('admin.import'))}</button>
      <button type="button" class="btn btn-danger" data-act="reset">↺ ${esc(t('admin.reset'))}</button></div>
    <input type="file" id="impFile" accept="application/json,.json" hidden></div>
  <div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(t('admin.storage'))}</span></div>
    <div>${esc(t('admin.storage'))}: ${(used / 1024 / 1024).toFixed(2)} MB / ~4.5 MB</div>
    <div class="stg-bar"><div class="stg-i" style="width:${pct}%"></div></div>
    ${pct > 85 ? `<div class="stg-warn">${esc(t('admin.storageWarning'))}</div>` : ''}</div>`;
}

/* ---------- admin render ---------- */
function renderAdmin() {
  const app = document.getElementById('app');
  document.getElementById('ftr').innerHTML = '';
  if (!isAdmin()) {
    app.innerHTML = `<div class="page"><div class="login">
      <div class="rsq"></div>
      <h1 class="d3">${esc(t('admin.loginTitle'))}</h1>
      <input class="in" type="password" id="pwIn" placeholder="${esc(t('admin.password'))}"
        aria-label="${esc(t('admin.password'))}" style="max-width:280px">
      <button type="button" class="btn" id="pwGo">${esc(t('admin.enter'))}</button>
      <p class="label" style="letter-spacing:.06em;text-transform:none">${esc(t('admin.hint'))}</p>
    </div></div>`;
    const go = async () => {
      const v = document.getElementById('pwIn').value;
      if ((await sha256hex(v)) === pwHash()) {
        sstore.set(SS_ADMIN, '1');
        render();
      } else { toast(t('admin.wrongPassword')); document.getElementById('pwIn').value = ''; }
    };
    document.getElementById('pwGo').addEventListener('click', go);
    document.getElementById('pwIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    return;
  }
  const tabs = [
    ['sections', t('admin.tabs.sections')], ['home', t('admin.tabs.home')],
    ['cv', t('admin.tabs.cv')], ['contacts', t('admin.tabs.contacts')],
    ['settings', t('admin.tabs.settings')],
  ];
  let body = '';
  if (adminTab === 'sections') body = tabSections();
  else if (adminTab === 'home') body = tabHome();
  else if (adminTab === 'cv') body = tabCV();
  else if (adminTab === 'contacts') body = tabContacts();
  else body = tabSettings();
  app.innerHTML = `<div class="page adm"><div class="wrap">
    <div class="adm-top">
      <h1 class="d3">${esc(t('admin.loginTitle'))}</h1>
      <a class="btn btn-ghost btn-sm" href="#/">${esc(t('admin.viewSite'))}</a>
      <button type="button" class="btn btn-ghost btn-sm" data-act="admin-logout">${esc(t('admin.logout'))}</button>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) =>
      `<button type="button" role="tab" class="tab ${adminTab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${esc(l)}</button>`).join('')}</div>
    <div id="admBody">${body}</div>
    <input type="file" id="uplFile" accept="image/*" multiple hidden>
  </div></div>`;
  const imp = document.getElementById('impFile');
  if (imp) imp.addEventListener('change', doImport);
  const uf = document.getElementById('uplFile');
  if (uf) uf.addEventListener('change', doUpload);
}

/* ---------- uploads ---------- */
function readFile(f) {
  return new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.readAsDataURL(f);
  });
}
function imgDims(src) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => res([im.naturalWidth, im.naturalHeight]);
    im.onerror = () => res([0, 0]);
    im.src = src;
  });
}
async function doUpload(e) {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length || !uplTarget) return;
  const made = [];
  for (let n = 0; n < files.length; n++) {
    const f = files[n];
    if (!f.type.startsWith('image/')) continue;
    if (storageBytes() + f.size > 4.6 * 1024 * 1024) { toast(t('admin.uploadTooBig')); break; }
    const src = await readFile(f);
    const [w, h] = await imgDims(src);
    const id = 'upl-' + Date.now() + '-' + n;
    UPLOADS[id] = { src, w, h };
    made.push(id);
  }
  if (!made.length) return;
  if (uplTarget.mode === 'single') {
    setPath(DATA, uplTarget.path, made[0]);
  } else {
    const arr = getPath(DATA, uplTarget.path);
    if (Array.isArray(arr)) {
      if (uplTarget.path.endsWith('.works')) {
        made.forEach((id) => arr.push({
          image: id, title: { en: '', uk: '' }, technique: { en: '', uk: '' },
          year: '', description: { en: '', uk: '' },
        }));
      } else arr.push(...made);
    }
  }
  persist(); toast(t('admin.saved'));
  renderAdmin();
}
function doImport(e) {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  readFile(f).then((txt) => {
    try {
      const j = JSON.parse(txt);
      const d = j.data || j;
      if (!d.sections || !d.site || !d.cv) throw new Error('bad');
      DATA = d;
      UPLOADS = j.uploads || {};
      persist(); toast(t('admin.importOk'));
      renderAdmin();
    } catch (err) { toast(t('admin.importBad')); }
  });
}

/* ---------- admin actions ---------- */
function move(arr, i, d) {
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}
document.addEventListener('click', async (e) => {
  if (S.route.name !== 'admin' || !isAdmin()) return;
  const tab = e.target.closest('[data-act="tab"]');
  if (tab) { adminTab = tab.dataset.tab; renderAdmin(); return; }
  const up = e.target.closest('[data-upl]');
  if (up) {
    uplTarget = { path: up.dataset.path, mode: up.dataset.upl };
    document.getElementById('uplFile').click();
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  const d = a.dataset;
  const sec = (i) => DATA.sections[i];
  const blk = (i, j) => DATA.sections[i].blocks[j];
  switch (act) {
    case 'admin-logout': sstore.del(SS_ADMIN); render(); return;
    case 'export': {
      const blob = new Blob([JSON.stringify({ data: DATA, uploads: UPLOADS }, null, 1)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'mattilda-portfolio-data.json';
      link.click(); URL.revokeObjectURL(url);
      return;
    }
    case 'import-btn': document.getElementById('impFile').click(); return;
    case 'reset':
      if (!confirm(t('admin.confirmReset'))) return;
      store.del(LS_DATA); store.del(LS_UPLOADS);
      DATA = clone(window.__SEED__); UPLOADS = {};
      renderAdmin(); toast(t('admin.saved')); return;
    case 'pw-change': {
      const v = document.querySelector('[data-path="adm-newpw"]').value;
      if (v.length < 6) { toast(LANG === 'uk' ? 'Мінімум 6 символів' : 'At least 6 characters'); return; }
      store.set(LS_PW, await sha256hex(v));
      toast(t('admin.passwordChanged')); renderAdmin(); return;
    }
    case 'sec-add':
      DATA.sections.push({
        slug: 'section-' + Date.now().toString(36),
        label: { en: 'New section', uk: 'Новий розділ' },
        subtitle: { en: '', uk: '' }, lead: { en: '', uk: '' }, cover: '',
        intro: [{ en: '', uk: '' }], blocks: [{ kind: 'works', title: { en: '', uk: '' }, works: [] }],
      });
      break;
    case 'sec-del':
      if (!confirm(t('admin.confirmDelete'))) return;
      DATA.sections.splice(+d.i, 1); break;
    case 'sec-up': move(DATA.sections, +d.i, -1); break;
    case 'sec-down': move(DATA.sections, +d.i, 1); break;
    case 'intro-add': sec(+d.i).intro.push({ en: '', uk: '' }); break;
    case 'intro-del': sec(+d.i).intro.splice(+d.k, 1); break;
    case 'blk-add': sec(+d.i).blocks.push(
      d.kind === 'works' ? { kind: 'works', title: { en: '', uk: '' }, works: [] } :
      d.kind === 'photos' ? { kind: 'photos', title: { en: '', uk: '' }, photos: [] } :
      d.kind === 'text' ? { kind: 'text', title: { en: '', uk: '' }, paras: [] } :
      { kind: 'links', title: { en: '', uk: '' }, items: [] });
      break;
    case 'blk-del': sec(+d.i).blocks.splice(+d.j, 1); break;
    case 'blk-up': move(sec(+d.i).blocks, +d.j, -1); break;
    case 'blk-down': move(sec(+d.i).blocks, +d.j, 1); break;
    case 'para-add': blk(+d.i, +d.j).paras.push({ en: '', uk: '' }); break;
    case 'para-del': blk(+d.i, +d.j).paras.splice(+d.k, 1); break;
    case 'lnk-add': blk(+d.i, +d.j).items.push({ label: { en: '', uk: '' }, url: '' }); break;
    case 'lnk-del': blk(+d.i, +d.j).items.splice(+d.k, 1); break;
    case 'work-add': blk(+d.i, +d.j).works.push({
      image: '', title: { en: '', uk: '' }, technique: { en: '', uk: '' }, year: '', description: { en: '', uk: '' } });
      break;
    case 'work-del': blk(+d.i, +d.j).works.splice(+d.k, 1); break;
    case 'work-up': move(blk(+d.i, +d.j).works, +d.k, -1); break;
    case 'work-down': move(blk(+d.i, +d.j).works, +d.k, 1); break;
    case 'work-cover': sec(+d.i).cover = blk(+d.i, +d.j).works[+d.k].image; break;
    case 'work-img-del': blk(+d.i, +d.j).works[+d.k].image = ''; break;
    case 'photo-del': blk(+d.i, +d.j).photos.splice(+d.k, 1); break;
    case 'photo-up': move(blk(+d.i, +d.j).photos, +d.k, -1); break;
    case 'photo-down': move(blk(+d.i, +d.j).photos, +d.k, 1); break;
    case 'stmt-add': DATA.site.statement.push({ en: '', uk: '' }); break;
    case 'stmt-del': DATA.site.statement.splice(+d.k, 1); break;
    case 'card-add': DATA.site.cards.push({
      image: '', title: { en: '', uk: '' }, desc: { en: '', uk: '' },
      section: DATA.sections[0] ? DATA.sections[0].slug : '' });
      break;
    case 'card-del': DATA.site.cards.splice(+d.k, 1); break;
    case 'arch-del': DATA.site.archive.photos.splice(+d.k, 1); break;
    case 'cvg-add': DATA.cv.groups.push({ title: { en: '', uk: '' }, items: [] }); break;
    case 'cvg-del': if (!confirm(t('admin.confirmDelete'))) return; DATA.cv.groups.splice(+d.gi, 1); break;
    case 'cvg-up': move(DATA.cv.groups, +d.gi, -1); break;
    case 'cvg-down': move(DATA.cv.groups, +d.gi, 1); break;
    case 'cvi-add': DATA.cv.groups[+d.gi].items.push({ year: '', place: { en: '', uk: '' }, what: { en: '', uk: '' }, detail: { en: '', uk: '' } }); break;
    case 'cvi-del': DATA.cv.groups[+d.gi].items.splice(+d.ii, 1); break;
    case 'cvi-up': move(DATA.cv.groups[+d.gi].items, +d.ii, -1); break;
    case 'cvi-down': move(DATA.cv.groups[+d.gi].items, +d.ii, 1); break;
    default: return;
  }
  persist(); toast(t('admin.saved'));
  renderAdmin();
});
/* inputs -> data (change/blur, no full re-render while typing) */
document.addEventListener('change', (e) => {
  if (S.route.name !== 'admin' || !isAdmin()) return;
  const el = e.target;
  const path = el.getAttribute && el.getAttribute('data-path');
  if (!path || path === 'adm-newpw') return;
  setPath(DATA, path, el.type === 'checkbox' ? el.checked : el.value);
  persist(); toast(t('admin.saved'));
});

/* ---------- boot (last script on the page) ---------- */
render();

</script>
