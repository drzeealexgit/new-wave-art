:root{
  --ink:#1B1713; --ink-2:#241F1A; --bone:#F4F0E8; --bone-2:#ECE6D9; --bone-3:#FBF9F3;
  --stone:#8A8175; --stone-2:#5E574D; --ember:#A63A1E; --line:#D9D1C1; --line-d:#3A332B;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px; --s7:96px; --s8:144px;
  --wrap:1280px; --pad:clamp(20px,6vw,96px);
  --ease:cubic-bezier(.22,.61,.21,1);
  --inv-bg:#1B1713; --inv-fg:#F4F0E8;
}
html[data-theme="dark"]{
  --ink:#EDE7DB; --ink-2:#E0D8C9; --bone:#161210; --bone-2:#1D1814; --bone-3:#221C16;
  --stone:#8F8577; --stone-2:#A99C89; --ember:#C4532F; --line:#332C24; --line-d:#4A4136;
  --inv-bg:#100E0B; --inv-fg:#EDE7DB;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bone);color:var(--ink);font:400 17px/1.75 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--ember);color:var(--bone)}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.skip{position:absolute;left:-9999px;top:0;background:var(--inv-bg);color:var(--inv-fg);padding:10px 16px;z-index:200}
.skip:focus{left:12px;top:12px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--pad)}

/* ---------- header ---------- */
.hdr{position:fixed;inset:0 0 auto 0;z-index:60;background:color-mix(in srgb,var(--bone) 90%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);height:64px;display:flex;align-items:center;gap:var(--s4)}
.brand{font:600 21px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
.nav{display:flex;gap:clamp(12px,1.6vw,26px);margin-left:auto;flex-wrap:nowrap;overflow:visible}
.nav a{font:500 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.14em;color:var(--stone-2);
  padding:6px 0;border-bottom:2px solid transparent;transition:color .25s var(--ease),border-color .25s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-color:var(--ember)}
.hdr-tools{display:flex;align-items:center;gap:var(--s3)}
.lang{display:flex;align-items:center;gap:7px;font:600 11px/1 var(--sans);letter-spacing:.12em}
.lang button{color:var(--stone);padding:6px 1px;transition:color .25s var(--ease)}
.lang button.on{color:var(--ember)}
.lang-sep{color:var(--line)}
.theme-btn{display:inline-flex;align-items:center;color:var(--stone-2);padding:4px 2px;transition:color .25s var(--ease)}
.theme-btn:hover{color:var(--ink)}
.theme-btn svg{width:17px;height:17px;display:block}
html[data-theme="dark"] .theme-btn .ic-moon{display:none}
html:not([data-theme="dark"]) .theme-btn .ic-sun{display:none}
.menu .theme-btn{color:var(--inv-fg);opacity:.9}
.menu .theme-btn:hover{color:var(--inv-fg);opacity:1}
.burger{display:none;flex-direction:column;gap:6px;padding:10px 2px}
.burger span{display:block;width:26px;height:1.5px;background:var(--ink);transition:transform .3s var(--ease)}

/* ---------- fullscreen menu ---------- */
.menu{position:fixed;inset:0;z-index:55;background:var(--inv-bg);color:var(--inv-fg);
  display:flex;flex-direction:column;padding:110px var(--pad) 40px;overflow:auto}
.menu[hidden]{display:none}
.menu .lang button{color:#8f8577}.menu .lang button.on{color:var(--inv-fg)}
.menu .lang-sep{color:var(--line-d)}
.menu-links{display:flex;flex-direction:column;margin-top:34px}
.menu-links a{font:500 clamp(30px,7.2vw,46px)/1.22 var(--serif);padding:7px 0;color:var(--inv-fg);
  border-bottom:1px solid var(--line-d);display:flex;justify-content:space-between;align-items:baseline}
.menu-links a small{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--stone)}
.menu-links a.on{color:var(--inv-fg)}
.menu-links a.on small{color:var(--ember)}
.menu-foot{margin-top:auto;padding-top:40px;color:var(--stone);font-size:13px}

/* ---------- shared page ---------- */
.app{min-height:100vh;padding-top:64px}
.page{animation:pg .55s var(--ease) both}
@keyframes pg{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.label{font:600 11px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.2em;color:var(--stone)}
.label .cnt{color:var(--ember)}
.rule{height:1px;background:var(--line);border:0}
.d2{font:500 clamp(38px,6vw,74px)/1.02 var(--serif);letter-spacing:-.01em}
.d3{font:500 clamp(26px,3.2vw,38px)/1.15 var(--serif)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .page{animation:none}
}

/* ---------- home hero ---------- */
.hero{position:relative;min-height:calc(100svh - 64px);display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
  gap:clamp(24px,4vw,72px);align-items:end;padding-block:clamp(40px,7vh,90px) clamp(28px,5vh,64px)}
.hero-name{font:600 clamp(54px,9vw,124px)/.94 var(--serif);letter-spacing:-.015em;margin:18px 0 22px}
.hero-role{font:500 clamp(19px,2.2vw,26px)/1.35 var(--serif);font-style:italic;color:var(--stone-2);max-width:30ch}
.hero-about{margin-top:22px;max-width:46ch;font-size:15.5px;color:var(--stone-2)}
.hero-pull{display:flex;gap:16px;align-items:baseline;margin-top:34px}
.hero-pull .mark{width:34px;height:1px;background:var(--ember);position:relative;top:-6px;flex:none}
.hero-pull em{font:500 italic clamp(19px,2.4vw,27px)/1.3 var(--serif)}
.hero-img{position:relative;align-self:stretch;display:flex;align-items:flex-end}
.hero-img img{width:100%;object-fit:cover;max-height:74vh}
.hero-img::after{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--line);z-index:-1}
.hero-scroll{position:absolute;left:var(--pad);bottom:22px;display:flex;align-items:center;gap:12px;color:var(--stone)}
.hero-scroll i{display:block;width:1px;height:44px;background:var(--stone);animation:drip 2.2s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- manifesto (dark) ---------- */
.dark{background:var(--inv-bg);color:var(--inv-fg)}
.manif{padding-block:clamp(80px,12vh,150px) }
.manif .label{color:#9a9083}
.manif p{font:500 italic clamp(22px,3vw,33px)/1.5 var(--serif);max-width:24em;margin-top:34px}
.manif p:first-of-type::before{content:"";display:block;width:44px;height:1px;background:var(--ember);margin-bottom:34px}
.manif .who{margin-top:44px;font:600 11px/1.6 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#9a9083}

/* ---------- home cards ---------- */
.cards{padding-block:clamp(64px,9vh,120px)}
.card{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);
  align-items:center;padding-block:clamp(32px,5vh,58px);border-top:1px solid var(--line)}
.cards .card:first-child{border-top:0}
.card-img{overflow:hidden;background:var(--bone-2)}
.card-img img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .8s var(--ease)}
.card:hover .card-img img{transform:scale(1.025)}
.card-t{font:500 clamp(30px,3.6vw,44px)/1.05 var(--serif);margin:12px 0 16px}
.card-d{color:var(--stone-2);font-size:15.5px;max-width:58ch}
.card-go{display:inline-flex;align-items:center;gap:12px;margin-top:26px;font:600 11px/1 var(--sans);
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.card-go::before{content:"";width:30px;height:1px;background:var(--ember);transition:width .35s var(--ease)}
.card:hover .card-go::before{width:52px}

/* ---------- photo strip ---------- */
.strip{columns:3;column-gap:26px;padding-block:var(--s5) 0}
.strip figure{margin:0 0 26px;break-inside:avoid;background:var(--bone-3);border:1px solid var(--line);padding:10px}
.strip img{width:100%}
.arch-head{display:flex;justify-content:space-between;align-items:baseline;padding-top:var(--s7)}

/* ---------- section page ---------- */
.sec-head{padding-block:clamp(56px,9vh,120px) clamp(32px,5vh,56px)}
.sec-head .lab{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.sec-lead{margin-top:20px}
.sec-sub{margin-top:14px}
.sec-intro{max-width:768px;margin-top:clamp(28px,4vh,44px);display:grid;gap:18px}
.sec-intro p{color:var(--stone-2)}
.sec-intro p.name-credit{font:500 italic 20px/1.4 var(--serif);color:var(--ink)}
.sec-intro p.note-line{font:600 11px/1.6 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}

/* works */
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(44px,6vh,72px) clamp(24px,3vw,44px);padding-block:var(--s5)}
.work{cursor:pointer}
.work.wide{grid-column:1/-1}
.work-img{background:var(--bone-3);border:1px solid var(--line);padding:12px}
.work-img img{width:100%;transition:transform .8s var(--ease),filter .8s var(--ease)}
.work:hover .work-img img{transform:scale(1.02)}
.work-cap{display:flex;justify-content:space-between;gap:18px;padding-top:14px}
.work-t{font:500 italic 19px/1.35 var(--serif)}
.work:hover .work-t{text-decoration:underline;text-decoration-color:var(--ember);text-underline-offset:5px;text-decoration-thickness:1px}
.work-m{font:400 12.5px/1.6 var(--sans);color:var(--stone);text-align:right;white-space:nowrap}
.work.reserved .work-img{aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--inv-bg);border-color:var(--line-d)}
.work.reserved{cursor:default}
.rsq{width:54px;height:54px;transform:rotate(45deg);border:1px solid var(--ember)}
.work.reserved .work-t{color:var(--inv-fg);font-size:22px;text-decoration:none}
.work.reserved .work-m{color:#9a9083}
.work.reserved .rs-note{font:600 10.5px/1.6 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#9a9083;text-align:center;max-width:24ch}

/* text block */
.txt-blk{max-width:768px;padding-block:clamp(40px,7vh,80px)}
.txt-blk h3{font:500 clamp(24px,2.8vw,34px)/1.2 var(--serif);margin-bottom:18px}
.txt-blk h3::after{content:"";display:block;width:38px;height:1px;background:var(--ember);margin-top:16px}
.txt-blk p{color:var(--stone-2);margin-top:16px}

/* links block */
.lnk-blk{padding-block:var(--s5);display:grid;gap:18px;justify-items:start}
.lnk{display:inline-flex;align-items:center;gap:14px;font:500 17px/1.4 var(--serif);font-style:italic;
  border-bottom:1px solid var(--line);padding-bottom:6px;transition:border-color .3s var(--ease)}
.lnk:hover{border-color:var(--ember)}
.lnk::before{content:"→";font-style:normal;font-family:var(--sans);font-size:14px;color:var(--ember)}

/* prev/next */
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:clamp(64px,10vh,130px)}
.pn a{padding:clamp(28px,5vh,48px) var(--pad);display:flex;flex-direction:column;gap:10px}
.pn a+a{border-left:1px solid var(--line);text-align:right;align-items:flex-end}
.pn .d3{transition:color .3s var(--ease)}
.pn a:hover .d3{color:var(--ember)}
.pn svg{width:26px;height:12px;stroke:var(--stone)}

/* ---------- CV ---------- */
.cv-name{font:500 clamp(34px,5vw,58px)/1.05 var(--serif);margin-top:14px}
.cv-groups{margin-top:clamp(40px,7vh,72px)}
.cv-g{border-top:1px solid var(--line);padding-block:clamp(26px,4vh,40px) clamp(30px,5vh,44px)}
.cv-g:first-child{border-top:0}
.cv-it{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 28px;padding:13px 0;border-bottom:1px solid var(--line)}
.cv-it:last-child{border-bottom:0}
.cv-y{font:600 12px/1.9 var(--sans);letter-spacing:.08em;color:var(--stone)}
.cv-w{font-weight:500}
.cv-p{color:var(--stone-2);font-size:15px}
.cv-d{color:var(--stone);font-size:15px}

/* ---------- contacts ---------- */
.cta{padding-block:clamp(60px,10vh,120px) clamp(80px,14vh,160px)}
.ct-rows{margin-top:clamp(40px,7vh,72px);border-top:1px solid var(--line)}
.ct-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:baseline;
  padding-block:clamp(20px,3.4vh,32px);border-bottom:1px solid var(--line)}
.ct-v{font:500 clamp(24px,3.4vw,40px)/1.2 var(--serif);word-break:break-word}
a.ct-v{border-bottom:1px solid var(--line);transition:border-color .3s var(--ease),color .3s var(--ease)}
a.ct-v:hover{color:var(--ember);border-color:var(--ember)}
.ct-note{margin-top:28px;color:var(--stone);font-size:14px;max-width:52ch}

/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--line);background:var(--bone-3)}
.ftr-in{max-width:var(--wrap);margin:0 auto;padding:var(--s5) var(--pad);display:grid;gap:var(--s4)}
.ftr-top{display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;align-items:baseline}
.ftr-nav{display:flex;gap:18px;flex-wrap:wrap}
.ftr-nav a,.ftr a.adm-lnk{font:500 11px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--stone-2)}
.ftr-nav a:hover,.ftr a.adm-lnk:hover{color:var(--ember)}
.ftr-bot{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;color:var(--stone);font-size:12.5px}
.adm-lnk{border-bottom:1px dotted var(--stone)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:80;background:rgba(23,19,15,.97);color:var(--bone);
  display:flex;align-items:center;justify-content:center;animation:lg .35s var(--ease)}
.lb[hidden]{display:none}
@keyframes lg{from{opacity:0}to{opacity:1}}
.lb-fig{max-width:min(92vw,1200px);max-height:78vh;display:flex;align-items:center;justify-content:center}
.lb-fig img{max-width:100%;max-height:78vh;object-fit:contain;animation:pg .45s var(--ease)}
.lb-fig .lb-reserved{display:flex;flex-direction:column;align-items:center;gap:22px;padding:60px 40px;text-align:center}
.lb-x{position:absolute;top:18px;right:22px;font:300 34px/1 var(--sans);color:var(--bone);padding:10px}
.lb-x:hover{color:var(--ember)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font:300 52px/1 var(--sans);color:var(--bone);
  padding:22px 18px;transition:color .25s}
.lb-nav:hover{color:var(--ember)}
.lb-prev{left:6px}.lb-next{right:6px}
.lb-count{position:absolute;top:26px;left:28px;font:600 11px/1 var(--sans);letter-spacing:.2em;color:var(--ember)}
.lb-cap{position:absolute;left:28px;right:28px;bottom:22px;display:flex;justify-content:space-between;
  gap:28px;align-items:flex-end;pointer-events:none}
.lb-t{font:500 italic 21px/1.3 var(--serif)}
.lb-m{font:400 12.5px/1.6 var(--sans);color:#b5ab9c;text-align:right;white-space:nowrap}
.lb-d{margin-top:10px;max-width:64ch;font-size:14px;line-height:1.7;color:#cfc7b8}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:var(--inv-bg);
  color:var(--inv-fg);font:500 12px/1 var(--sans);letter-spacing:.1em;padding:13px 22px;border-radius:2px;
  animation:pg .3s var(--ease)}
.toast[hidden]{display:none}

/* ---------- admin ---------- */
.adm{padding-block:clamp(36px,6vh,64px) 120px}
.adm-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.adm-top .d3{margin-right:auto}
.login{max-width:400px;margin:clamp(60px,12vh,140px) auto;text-align:center;display:grid;gap:18px;justify-items:center}
.login .rsq{margin-bottom:6px}
.login .in{text-align:center}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:clamp(24px,4vh,40px);overflow-x:auto}
.tab{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--stone);
  padding:0 2px 14px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--ember)}
.adm-card{background:var(--bone-3);border:1px solid var(--line);padding:clamp(16px,2.5vw,26px);margin-bottom:20px}
.adm-card>.ac-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ac-title{font:500 20px/1.2 var(--serif);margin-right:auto}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld-l{font:600 10.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--stone)}
.in{width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;font:400 14px/1.55 var(--sans);color:var(--ink)}
.in:focus{outline:none;border-color:var(--ink)}
html[data-theme="dark"] .in,html[data-theme="dark"] .upl,
html[data-theme="dark"] .thumb,html[data-theme="dark"] .ibtn{background:#251F19;border-color:var(--line)}
textarea.in{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row23{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--inv-bg);color:var(--inv-fg);
  font:600 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;transition:background .25s}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:12px;margin-bottom:8px}

.thumb .th-ops{position:absolute;inset:5px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(27,23,19,.78);opacity:0;transition:opacity .2s}

.blk-kind{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--bone);
  background:var(--stone-2);padding:5px 9px;margin-right:auto}
.adm-note{font-size:13px;color:var(--stone-2);border-left:2px solid var(--ember);padding:4px 0 4px 14px;margin-bottom:18px}
.stg{margin-top:8px}
.stg-bar{height:4px;background:var(--line);margin-top:6px}
.stg-i{height:100%;background:var(--ember);transition:width .4s}
.stg-warn{color:var(--ember);font-size:13px;margin-top:8px}
.savings{position:fixed;right:22px;bottom:22px;z-index:70;background:var(--inv-bg);color:var(--inv-fg);
  font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;

}

ивопис, графіка, скульптура"},"about":{"en":"For now, mastering a new technic - animation, and also managing two projects with object art.","uk":"Зараз опановую нову техніку — анімацію, а також веду два проєкти з об'єктного мистецтва."},"pull":{"en":"Sometimes may be good, sometimes maybe war","uk":"Іноді може бути добре, іноді — може бути війна"},"image":"830da7_3650ffe733f3431d9d881fbfc29aecf9~mv2.jpg"},"statement":[{"en":"\"Sometimes may be good, sometimes maybe war\", but creativity cannot leave us even in such times. and works biologically like life self-expression. The way of understanding the world's senses and self-awareness.","uk":"«Іноді може бути добре, іноді — може бути війна», але творчість не може покинути нас навіть у такі часи; і працює біологічно, як самовираження життя. Це спосіб розуміння смислів світу й усвідомлення себе."},{"en":"When art is a code of the broadcast — your CODE-reactor instantly has an appropriate reaction in the form of every movement of your stylistic currents to the endless variations of manifestations of our world.","uk":"Коли мистецтво є кодом трансляції — твій КОД-реактор миттєво дає відповідну реакцію у формі кожного руху твоїх стилістичних течій на нескінченні варіації проявів нашого світу."}],"cards":[{"image":"830da7_3650ffe733f3431d9d881fbfc29aecf9~mv2.jpg","title":{"en":"paints","uk":"фарби"},"desc":{"en":"Slovenian - Estonian series of canvases created during the last few life longest months as forced refugee due to the War in Central Europe (Ukraine). The reality of Cultural genocide threat instantly forced me to emotional maturity and personal responsibility, in addition creativity boosted for survival purpose. That changes opened possibility to quickly absorb the art masters experience in several European collaborations and made brave experiments with materials. Challenges accepted, next passing to a new level of creativity and uses of art techniques combinations. Some of artwork reminiscent of unreal cosmic landscapes, but all of them are an artefacts of actual happenings. Paintings build some sort tape events during the interventions period.","uk":"Словенсько-естонська серія полотен, створена протягом найдовших останніх місяців мого життя в статусі вимушеної біженки через війну в Центральній Європі (Україні). Реальність загрози культурному геноциду миттєво змусила мене до емоційної зрілості й особистої відповідальності, а творчість отримала імпульс для виживання. Ці зміни відкрили можливість швидко засвоювати досвід майстрів у кількох європейських колабораціях і сміливо експериментувати з матеріалами. Виклики прийнято — перехід на новий рівень творчості та поєднання художніх технік. Деякі роботи нагадують нереальні космічні пейзажі, але всі вони — артефакти реальних подій. Картини будують своєрідну стрічку подій воєнного періоду."},"section":"paint"},{"image":"751718_72145e6aa8944df2b4af36fc29269dc1~mv2.jpg","title":{"en":"graphics","uk":"графіка"},"desc":{"en":"Graphics became a technique for accurately reflecting the diversity and populousness of my inner universe. Placing many stories within the limited space is a painstaking process 1-2 weeks for one piece. The multi-layered, sometimes non-overlapping scenes often made up complex but not-so-obvious storylines. Kind of artwork, as usual, created a wow effect - new characters were found time after time when reviewing the artwork. Of the unusual technique, semantic content and multiple layers, my paints have won prizes in local and international competitions, including a worldwide painting competition in Japan.","uk":"Графіка стала технікою точного відображення різноманіття й населеності мого внутрішнього всесвіту. Розмістити багато історій в обмеженому просторі — кропіткий процес: 1–2 тижні на одну роботу. Багатошарові, іноді неперетинні сцени складали складні й неочевидні сюжетні лінії. Такі роботи зазвичай створювали «вау-ефект» — нових персонажів знаходили знову і знову при перегляді. Завдяки незвичній техніці, смисловому наповненню та багатьом шарам мої картини отримували нагороди на місцевих і міжнародних конкурсах, зокрема на всесвітньому конкурсі живопису в Японії."},"section":"graphic"},{"image":"830da7_06bf07d0352f4bfbbeec8180814903f1~mv2.jpg","title":{"en":"objects","uk":"скульптура"},"desc":{"en":"","uk":""},"section":"objects"},{"section":"exhibition","image":"830da7_f41aab1d9cfe4ee3bf83b1b6995b1ca6~mv2.jpg","title":{"uk":"експозиції","en":"exhibitions"},"desc":{"uk":"Виставки, перформанс і спільні проєкти.","en":"Exhibitions, performance and joint projects."}}],"archive":{"photos":["830da7_95bcc7eceb0a4cdfb133158087212c37~mv2.jpg","830da7_91b1a616fc324a8abda3daccb485ec48~mv2.jpg","830da7_7de08a9f4f40449f939f057c840fc5c8~mv2.jpeg"]}},"sections":[{"slug":"kyiv2025","label":{"en":"Kyiv 2025","uk":"Київ 2025"},"subtitle":{"en":"latest works","uk":"останні роботи"},"lead":{"en":"","uk":""},"cover":"kyiv2025-01.jpg","intro":[{"en":"New works made in Kyiv. Titles and descriptions will be added by the artist.","uk":"Нові роботи, створені в Києві. Назви та описи додасть художниця."}],"blocks":[{"kind":"works","title":{"en":"","uk":""},"works":[{"image":"kyiv2025-01.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}},{"image":"kyiv2025-02.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}},{"image":"kyiv2025-03.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}},{"image":"kyiv2025-04.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}},{"image":"kyiv2025-05.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}},{"image":"kyiv2025-06.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}},{"image":"kyiv2025-07.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}}]}]},{"slug":"paint","label":{"en":"Paint","uk":"Фарба"},"subtitle":{"en":"beginning of the great war","uk":"період війни"},"lead":{"en":"the mixed drawing technique","uk":"змішана техніка малювання період війни"},"cover":"830da7_3650ffe733f3431d9d881fbfc29aecf9~mv2.jpg","intro":[{"en":"The period started with the flavor and colors of war.","uk":"Період, що почався зі смаку й кольорів війни."},{"en":"In contemporary humanistic experience, there weren't, no rational answers, tools, or ready-made solutions to counter barbarism. Appeal to the collective unconscious, historical memory, and the human genome - change personal identification and behavior patterns, in all the diversity of the national community. A total change in the usual \"landscape\" and with a brain new reality - your inner code-reactor reproduces new variations of the transmission of information.","uk":"У сучасному гуманістичному досвіді не було ані раціональних відповідей, ані інструментів, ані готових рішень проти варварства. Звернення до колективного несвідомого, історичної пам'яті та людського геному змінює особисту ідентифікацію і патерни поведінки в усьому різноманітті національної спільноти. Повна зміна звичного «пейзажу» й нова для мозку реальність — твій внутрішній код-реактор відтворює нові варіації передачі інформації."}],"blocks":[{"kind":"works","title":{"en":"","uk":""},"works":[{"image":"830da7_3650ffe733f3431d9d881fbfc29aecf9~mv2.jpg","title":{"en":"even against the Black Sea","uk":"навіть проти Чорного моря"},"technique":{"en":"acrylic, oil paint, cardboard","uk":"акрил, олійна фарба, картон"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_5450dcc0d50a4d25ac7694d65e35a653~mv2.jpg","title":{"en":"Loud loudness","uk":"Гучна гучність"},"technique":{"en":"acrylic, whitewash, canvas","uk":"акрил, побілка, полотно"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_a82ee89c3b4c4cc198df99b3457e9026~mv2.jpg","title":{"en":"too much oxygen","uk":"забагато кисню"},"technique":{"en":"30×40, acrylic, canvas","uk":"30×40, акрил, полотно"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_04286df6bf3c4291a79e4196d56b657a~mv2.jpg","title":{"en":"see, but I can't believe it, stop it","uk":"бачу, але не можу повірити — припини"},"technique":{"en":"100×40, acrylic, oil shallots, canvas","uk":"100×40, акрил, олія, полотно"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_ded10100ce3e4e2da36f8da7268aa566~mv2.jpg","title":{"en":"it's not just Bucha","uk":"це не тільки Буча"},"technique":{"en":"57×110, acrylic, marker, canvas","uk":"57×110, акрил, маркер, полотно"},"year":"2022","description":{"en":"The canvas shows the world of a happy and bright childhood together when killed and raped children by rusian soldiers never again will see a spring sky.","uk":"Полотно показує світ щасливого та яскравого спільного дитинства, коли вбиті та згвалтовані російськими солдатами діти ніколи більше не побачать весняного неба."}},{"image":"scan-artishok","title":{"en":"artichoke","uk":"артишок"},"technique":{"en":"watercolor, pastel (provisional)","uk":"акварель, пастель (уточнити)"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_a068005131f242dc9749d328f4124a39~mv2.jpg","title":{"en":"she handled her mom, breaking himself","uk":"вона справлялася з мамою, ламаючи себе"},"technique":{"en":"100/75, acrylic, oils, whitewashing, canvas","uk":"100/75, акрил, олія, побілка, полотно"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_36888513d7f54e0d9212b09e9e587fa1~mv2.jpg","title":{"en":"figures digging up blur contours","uk":"фігури, що викопують розмиті контури"},"technique":{"en":"150×90, acrylic, oils, whitewashing, sunflower oil, canvas","uk":"150х90, акрил, олія, побілка, соняшникова олія, полотно"},"year":"2022","description":{"en":"The canvas depicts a multi-colored composition, in the center of which three figures can be distinguished, digging the soil with shovels in search of people in mass brother graves. The living is already digging out the contours of the dead, innocent people who were killed while they were trying to find water or food, cross the road or cross a space on a bicycle, hide from a tank following them or an inhuman who came to someone else's house with a gun to kill and rape. Now, these are silhouettes that have been etched into our memory forever, which loved ones are so eager to bury with respect, remembering each name.","uk":"На полотні зображено різнобарвну композицію, в центрі якої можна виділити три постаті, які риють лопатами землю в пошуках людей у братських могилах. Живі вже розкопують контури загиблих, невинних людей, яких убили, коли вони шукали воду чи їжу, переходили дорогу чи перетинали простір на велосипеді, ховалися від танка, що їхав за ними, чи нелюда, який приїхав до чужий дім з рушницею вбивати і ґвалтувати. Тепер це силуети, які назавжди закарбувалися в нашій пам'яті, які близькі так прагнуть з пошаною поховати, пам'ятаючи кожне ім'я."}},{"image":"830da7_2db9f98cdc0f485ca5d93d6abcea21dc~mv2.jpg","title":{"en":"our sky, mountains and fields absorb the feelings of millions ears","uk":"Наші гори, небо і поля вбирають почуття мільйонів вух"},"technique":{"en":"140×100, acrylic, canvas","uk":"140х100, акрил, полотно"},"year":"2022","description":{"en":"The canvas depicts four main figures - two human silhouettes and two cars with the inscription of the Russian word \"children\". The depicted people pass into a large landscape, in which you can see all the landscapes of Ukraine, a country burning in flames, suffocating with smoke. Above are the native mountains, the sky and the fields along the road, and below is the Black Sea storm, which powerfully defends itself from the actions that took place in the spring of 2022. And there is another person in blue-yellow colors and one in red-black are one whole, that feel every car with shot civilians who were just trying to save their children.","uk":"На полотні зображені чотири головні фігури - два людських силуети і дві машини з написом російською мовою «діти». Зображені люди переходять у великий пейзаж, на якому видно всі краєвиди України, країни, що горить у вогні, задихається димом. Вгорі – рідні гори, небо і поля при дорозі, а внизу – Чорноморська буря, яка потужно захищається від подій, які відбувалися навесні 2022 року. І є ще одна людина в синьо-жовтих кольорах і червоно-чорні – це одне ціле, яке відчуває кожну машину з розстріляними мирними жителями, які просто намагалися врятувати своїх дітей."}}]},{"kind":"photos","title":{"en":"process","uk":"процес"},"photos":["830da7_120c4a9e7663478ea4ef4e3a29830b40~mv2.jpg","830da7_d8477e3d78d643b38bbd2f25a418a0b3~mv2.jpg","830da7_05c4c02ed63c497f94279e15121da930~mv2.jpg","830da7_23ea2242a997427094bdbe3653fea701~mv2.jpg","830da7_8cbe93dc6b5942e883eca8a1b31cc82d~mv2.jpg","830da7_9a8e07bcf7d14101b70379bb5c5bf1f7~mv2.jpg","830da7_cf49fb45863744a5b893cd40d959190b~mv2.jpg","830da7_b561461f69b745d6b05d6ccec875a438~mv2.jpg","830da7_c0c32be0ef1f4d43a9bebc5afa25e74e~mv2.jpg","830da7_e21a0280a3894aee98eb651552e245e8~mv2.jpg","830da7_5c8dd2eaf6d54199a9080bfc3305dc7f~mv2.jpg","830da7_7b422dfd0ad14f2d892c6a11f669ca43~mv2.jpg","830da7_a93c677b012641ea81770bd0acc40f5c~mv2.jpg","830da7_c55cca8279eb49558356f06e42c5fc58~mv2.jpg"]}]},{"slug":"graphic","label":{"uk":"Графіка та ілюстрація","en":"Graphic & Illustration"},"subtitle":{"en":"graf","uk":"граф"},"lead":{"en":"Graphic","uk":"Графіка"},"cover":"830da7_b0f843b414c1452dad32825e49f95d10~mv2.png","intro":[{"en":"It was an insider period when my relationship as a graphic artist began.","uk":"Це був період, коли почалися мої стосунки з графікою."},{"en":"The number of worlds and creatures, that fill them with the appropriate degree of detail, could be done in the best way thanks to graphic techniques. This is a difficult process, because it contains lots of details that need to be thought up, analyzed, and passed through yourself. There is a complete immersion in the process of finding the best variant of information transmission through the symbols, this monologue does not stop, even when you are busy with something else, it practically becomes a part of your identity.","uk":"Кількість світів і створінь, що наповнюють їх із належним ступенем деталізації, найкраще втілювалася саме графічними техніками. Робота над такою графікою — складний процес, оскільки він містить багато деталей, які потрібно продумати, проаналізувати та пропустити через себе. Відбувається повне занурення в процес пошуку найкращого варіанту передачі інформації через символи. Цей монолог не припиняється, навіть коли я зайнята чимось іншим, — він практично стає частиною мене."}],"blocks":[{"kind":"works","title":{"en":"","uk":""},"works":[{"image":"830da7_e5eae0624cb1409d9bba1a6fd5f05f0a~mv2.jpg","title":{"en":"from dusk till down","uk":"від сутінків до світанку"},"technique":{"en":"","uk":""},"year":"2018","description":{"en":"","uk":""}},{"image":"830da7_89cc8d5661694db5ac1ab1d5b4fc09a6~mv2.png","title":{"en":"the mountain spirit","uk":"дух гори"},"technique":{"en":"diptych","uk":"диптих"},"year":"2017","description":{"en":"","uk":""}},{"image":"830da7_2a61e00e24da4004bebd72185bd7980f~mv2.png","title":{"en":"the mountain spirit","uk":"дух гори"},"technique":{"en":"diptych","uk":"диптих"},"year":"2017","description":{"en":"","uk":""}},{"image":"830da7_b0f843b414c1452dad32825e49f95d10~mv2.png","title":{"en":"diamond soul","uk":"діамантова душа"},"technique":{"en":"","uk":""},"year":"2018","description":{"en":"","uk":""}},{"image":"scan-graphic-bubble","title":{"en":"","uk":""},"technique":{"en":"black pen, colored pencils","uk":"чорна ручка, кольорові олівці"},"year":"","description":{"en":"","uk":""}},{"image":"","title":{"en":"The Diamond","uk":"Діамант"},"technique":{"en":"A3, black pen","uk":"A3, чорна ручка"},"year":"","description":{"en":"Soul is unique and eternal, like a stone! Diseases can destroy the body, but can't kill the Soul! It just develop and learn, and harden the Will. Actions and achievements reached by making world a better and kinder place, can put into the shade any physical limitations, and make from that person the \"cut diamond\" worthy public attention and self-esteem.","uk":"Душа унікальна й вічна, як камінь! Хвороби можуть руйнувати тіло, але не здатні вбити Душу! Вона лише розвивається, вчиться і гартує Волю. Вчинки та досягнення — роблячи світ кращим і добрішим — здатні затьмарити будь-які фізичні обмеження і перетворити людину на «огранований діамант», гідний уваги суспільства і самоповаги."},"reserved":true}]},{"kind":"text","title":{"en":"Book illustrations","uk":"Книжкові ілюстрації"},"paras":[{"en":"for the novel \"Dealer of Reality\" in the cyberpunk genre by Nicholas Dimitrov.","uk":"за роман «Ділер реальності» в жанрі кіберпанк Ніколаса Димитрова."},{"en":"2019","uk":"2019"},{"en":"Near future. Humanity is mired in vices and excesses. Religion has turned into fast food. The elites are addicted to a new digital drug that allows them to create and experience 《Personal Realities》. The new religion of Transreality devalues and negates all religions of the past.","uk":"Найближче майбутнє. Людство загрузло в пороках і надмірностях. Релігія перетворилася на фастфуд. Еліти залежні від нового цифрового наркотику, який дозволяє їм створювати та відчувати 《Особисту реальність》. Нова релігія Transreality знецінює та заперечує всі релігії минулого."},{"en":"The work took place almost remotely from the author, who allowed me to interpret my part of the book exactly how I felt this.","uk":"Робота відбувалася майже віддалено від автора, який дозволив мені інтерпретувати свою частину книги саме так, як я її відчувала."}]},{"kind":"works","title":{"uk":"","en":""},"works":[{"image":"830da7_e3494c710f1a46edabe26b597781a845~mv2.jpg","title":{"en":"the logo of the new religion of Transreality","uk":"логотип нової релігії Трансреальності"},"technique":{"en":"","uk":""},"year":"2019","description":{"en":"","uk":""}},{"image":"830da7_19e8046c70d7487993cffc6022ba4fca~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"2019","description":{"en":"","uk":""}},{"image":"830da7_39dfc9c3e4d04496a0cf4861fd15fdcb~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"2019","description":{"en":"","uk":""}},{"image":"830da7_f467f292a73a43c0a6790177ca84c181~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"2019","description":{"en":"","uk":""}},{"image":"830da7_86bb3e53d66246f895e6781cc90c39c1~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"2019","description":{"en":"","uk":""}},{"image":"830da7_7d9b534bfc834ca3916e7c9a84d84e4b~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"2019","description":{"en":"","uk":""}},{"image":"830da7_9b33b2a9f658466a8d1fc7621415dc8b~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"2019","description":{"en":"","uk":""}},{"image":"book-cover-ua","title":{"uk":"Обкладинка — українське видання","en":"Cover — Ukrainian edition"},"technique":{"uk":"роман «Дилер реальності», книга","en":"the novel 'Diler reality', book"},"year":"2019","description":{"uk":"","en":""}},{"image":"book-cover-en","title":{"uk":"Обкладинка — англійське видання","en":"Cover — English edition"},"technique":{"uk":"«Dealer of Realities», книга","en":"'Dealer of Realities', book"},"year":"2019","description":{"uk":"","en":""}}]}]},{"slug":"objects","label":{"en":"Objects","uk":"Скульптура"},"subtitle":{"en":"imprint","uk":"обличчя"},"lead":{"en":"\"My pain is beautiful\"","uk":"\"My pain is beautiful\""},"cover":"830da7_39769e00a4cb4d7fb5a5fa3f4fa7cd29~mv2.jpg","intro":[{"en":"The idea of this project is to imprint in a mask, the face that was made of plaster with a plastic brain, the fact that the emotion of fear can be pretty. At the moment when I began to impose the plaster on the face of Daria Stiletska, she starts to feel the hard and multi-layered emotion of fear that wasn't just because of the process it was a much deeper and powerful fear, which was imprinted on the finished object.","uk":"Ідея цього проєкту — відбити в масці, в обличчі, зробленому з гіпсу з пластиковим мозком, той факт, що емоція страху може бути гарною. У момент, коли я почала накладати гіпс на обличчя Дарії Стилецької, вона почала відчувати важку й багатошарову емоцію страху — не лише через сам процес: це був значно глибший і потужніший страх, який відбився на готовому об'єкті."}],"blocks":[{"kind":"works","title":{"en":"","uk":""},"works":[{"image":"830da7_39769e00a4cb4d7fb5a5fa3f4fa7cd29~mv2.jpg","title":{"en":"the mask","uk":"маска"},"technique":{"en":"plaster, plastic","uk":"гіпс, пластик"},"year":"2022","description":{"en":"","uk":""}}]},{"kind":"photos","title":{"en":"the mask","uk":"маска"},"photos":["830da7_c75ded8c479a45db932e03b9c7139409~mv2.jpg","830da7_2edb0fdc361848d1b009b81691cda66a~mv2.jpg"]},{"kind":"photos","title":{"en":"the process","uk":"процес"},"photos":["830da7_2046f077d3354fbba4c2663d12e75a27~mv2.jpg","830da7_a3fc0166d6bb40c38b4ef35ff18619db~mv2.jpg"]},{"kind":"text","title":{"en":"2022, Estonia","uk":"2022, Естонія"},"paras":[]}]},{"slug":"exhibition","label":{"uk":"Експозиції та проєкти","en":"Exhibitions & Projects"},"subtitle":{"en":"","uk":""},"lead":{"en":"is this reality?","uk":"це реальність?"},"cover":"830da7_f41aab1d9cfe4ee3bf83b1b6995b1ca6~mv2.jpg","intro":[{"en":"The Series was made in Estonia in a personal Exhibition at the private Museum of Contemporary Art Kunsty in Vinnistu, during the period of forced transmigration. I translated a tape of imprints of Ukrainian War, as a personal way to support the Ukrainian Victory.","uk":"Серія створена в Естонії в період вимушеного переселення. Відбитки подій Української війни на персональній виставці у Вінницькому музеї, як особистий спосіб підтримки української перемоги."},{"en":"The opening was made with the collaboration of European colleagues, each with a unique qualification — a non-stop experiment with materials and techniques.","uk":"Співпраця європейських колег, де кожен має унікальну кваліфікацію — безперервний експеримент із матеріалами та техніками."},{"en":"Every work is an artifact of actual actions of what was happening on the territory of my motherland.","uk":"Кожна робота є артефактом реальних подій, що відбуваються на території України, створеними стрічкою подій."},{"en":"It was a two months process with non-stop experimentation with materials and techniques, non-stop processing and reflection through Collaborations with colleagues, each one has unique qualifications, and own strong background of unique culture codes.","uk":"Це був двомісячний процес безперервних експериментів з матеріалами й техніками, безупинного опрацювання та рефлексії через колаборації з колегами — кожен має унікальну кваліфікацію та власний міцний фундамент унікальних культурних кодів."},{"en":"The informational and personal-emotional field continues and speaks through ART storytelling.","uk":"Інформаційне та особистісно-емоційне поле продовжується і промовляє через ART storytelling."},{"en":"Have you ever doubted the reality of what is happening? Which country will be next on this front line? Does an Estonian peer ask themselves such questions? That is what this pavilion is about.","uk":"Ви коли-небудь сумнівалися в реальності того, що відбувається? Яка країна буде наступною на цьому фронті? Естонський ровесник задає їм такі запитання? Ось про що цей павільйон."}],"blocks":[{"kind":"works","title":{"en":"","uk":""},"works":[{"image":"830da7_f41aab1d9cfe4ee3bf83b1b6995b1ca6~mv2.jpg","title":{"en":"And you¿","uk":"І ти"},"technique":{"en":"118×90, acrylic, watercolor, oils, canvas","uk":"118/90, акрил, акварель, олія, полотно"},"year":"2022","description":{"en":"","uk":""}},{"image":"830da7_aed7de340a8e4a388eed7f9abb043ba4~mv2.jpg","title":{"en":"turbulence","uk":"турбулентність"},"technique":{"en":"134×123, acrylic, oil, bowl","uk":"134x123, акрил, олія, миска"},"year":"2022","description":{"en":"","uk":""}},{"image":"830da7_944c8f2b3e0c44eba873f43bfbc9ffaa~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"","uk":""},"year":"","description":{"en":"","uk":""}},{"image":"830da7_97ac23119b93442eb1550e039cca7200~mv2.jpg","title":{"en":"fashionable chernozem","uk":"модний чорнозем"},"technique":{"en":"acrylic, fabric","uk":"акрил, тканина"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_0e53c855772d4a44a969880e943cb9a4~mv2.jpg","title":{"en":"somewhere in there is my nest","uk":"десь там моє гніздо"},"technique":{"en":"166×63, oil, acrylic, watercolor, canvas","uk":"166x63, олія, акрил, акварель, полотно"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_1ddc922408d54b69972ac43025a939fc~mv2.jpg","title":{"en":"Mary Virgin","uk":"Богородиця Марія"},"technique":{"en":"plaster, plastic, watercolor","uk":"гіпс, пластика, акварель"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_13498873be094d23900501ce082610d2~mv2.jpg","title":{"en":"bleeding ears","uk":"кровоточать вуха"},"technique":{"en":"77×70, acrylic, wood","uk":"77x70, акрил, дерево"},"year":"2022","description":{"en":"","uk":""}},{"image":"830da7_108646c4f4f64a9da990fee8d55fbaae~mv2.jpg","title":{"en":"2811","uk":"2811"},"technique":{"en":"141×81, acrylic, oils, canvas","uk":"141x81, акрил, олія, полотно"},"year":"","description":{"en":"","uk":""}},{"image":"830da7_b02afedee0824daf92405295592a978a~mv2.jpg","title":{"en":"the Helgi and Harti","uk":"Хельгі і Харті"},"technique":{"en":"112×65, acrylic, oil paint","uk":"112х65, акрилові, масляні фарби"},"year":"","description":{"en":"","uk":""}}]},{"kind":"text","title":{"en":"realities","uk":"реальність"},"paras":[{"en":"The spatial concept of the exhibition has several special realities which embedded in separate open rooms, which together form a common pavilion. The intersection of these territories reflects the complex of incompatible contrasts that humanity endures in the real-time war.","uk":"Просторова концепція виставки містить кілька особливих реалій, вбудованих в окремі відкриті кімнати, які разом утворюють спільну зону. Перетин цих територій відображає складні й водночас дивовижні контрасти, в яких перебуває суспільство в реальний час війни."}]},{"kind":"photos","title":{"en":"the pavilion","uk":"павільйон"},"photos":["830da7_c243955fd69f4821b2ea362c885a659d~mv2.jpg","830da7_3ff75fb7dc794e8586e99bd745b97220~mv2.jpg","830da7_30367eea7fe34189885154f84fe28a63~mv2.jpeg","830da7_6f530814e6cc41cf872d166ff61f792f~mv2.jpg","830da7_abf1f9a6c6a744e3a49b0188f0d47998~mv2.jpeg","830da7_d9007d407f704bbf9198c6dd7c2853c2~mv2.png","830da7_447faa74d54140b9ac3c11cabfb90982~mv2.jpg","830da7_2eaf49cc2dab472aafdfad500ff4936f~mv2.jpg","830da7_d3e4b2ee4a494f1091abed607ebb76a7~mv2.jpg","830da7_f28b7a2f65204fd0bd58cc3c8e86907a~mv2.jpg"]},{"kind":"text","title":{"en":"the opening","uk":"відкриття"},"paras":[{"en":"@@openingSupport","uk":"@@openingSupport"}]},{"kind":"photos","title":{"en":"the opening","uk":"відкриття"},"photos":["830da7_3605b51a71ed492f9e58f9c856b42bc3~mv2.jpg","830da7_252002ce104c4f9ebef51df0fb7e9e9b~mv2.jpg","830da7_d8a9cb4f75334901b8dccd8f587cd6b0~mv2.jpg","830da7_77f1df347a39418c812365b7143734d4~mv2.jpg","830da7_30065946898b478ea48f22661c03f477~mv2.jpg","830da7_ecbd5930a7c0463cb9f3e9d6d87174b3~mv2.jpg","830da7_20a605d625ed44dab674535b85504d19~mv2.jpg"]},{"kind":"text","title":{"uk":"Перформанс","en":"Performance"},"paras":[{"en":"collaboration with Daria Stiletskaya \"GENOM_UA\"","uk":"співпраця з Дарією Стилецькою \"GENOM_UA\""},{"en":"Performance \"Ordinary Heroes\" how ONE artistic appeal by 2 Ukrainian artists to Estonians from the territory bordering on the aggressor country, waging a barbaric War in the central part of Europe. The 15-minute video of the reincarnation of faceless mannequins (heads, ironically in prof. Medium called «chumps») in shaved and colored flags of Estonia and russia - with a common white color in the center - as a symbol of the border between these countries. The art act takes place in the presence of free Hero David Bowie & under his single HEROES in the apocalyptic interior of the dilapidated Soviet archive at the Viinistu Art Museum, where Tilda Zvolinska will open a personal exhibition of the series of war paintings in August 2022. In the final video, Ukrainian artists shave each other's heads and paint the color of the flag of their country. And paint the color of the flag of their country. The flag that become a symbol of worldwide exposure.","uk":"Перформанс «Ordinary Heroes» як ОДНЕ мистецьке звернення 2-х українських митців до естонців із прикордонної з країною-агресором території, яка веде варварську війну в центральній частині Європи. 15-хвилинне відео перевтілення безликих манекенів (голови іронічно у проф. середні названі «чумпами») на поголених і кольорових прапорах Естонії та Росії — із загальним білим кольором у центрі — як символ кордону між цими країнами. Арт-акт відбувається в присутності вільного Героя Девіда Боуї та його сингла HEROES в апокаліптичному інтер'єрі напівзруйнованого радянського архіву Художнього музею Війністу, де Тільда Зволінська відкриє персональну виставку серії воєнних картин у серпні 2022 року. У фінальному відео укр. художники голять один одному голови і розфарбовують колір прапора своєї країни. Прапор, який став символом всесвітньої експозиції."},{"en":"@@credit","uk":"@@credit"},{"en":"@@madeWithSupport: international community \"LOBOS\" and Joonas Nickholm","uk":"@@madeWithSupport: міжнародна спільнота «LOBOS» і Йоонас Нікгольм"}]},{"kind":"photos","title":{"en":"","uk":""},"photos":["830da7_a054f8d2bf564913b898e67e07241c24~mv2.jpg","830da7_cf8ff17e9a2c4b35842a5e7e571687fa~mv2.jpg"]},{"kind":"photos","title":{"en":"performance in a paper costume","uk":"перформанс у паперовому костюмі"},"photos":["scan-perf-01","scan-perf-02","scan-perf-03"]},{"kind":"links","title":{"en":"","uk":""},"items":[{"label":{"en":"@@watchVideo","uk":"@@watchVideo"},"url":"https://1drv.ms/v/s!Anym-lu2pvathUhefJ5Y12J7bmIo"},{"label":{"en":"linktr.ee/tildaz","uk":"linktr.ee/tildaz"},"url":"https://linktr.ee/tildaz"}]},{"kind":"text","title":{"uk":"Співпраці","en":"Collaborations"},"paras":[{"en":"The collaboration with Lenovo is a creative experiment where the possibilities of digital tools are used to transform static painting into a dynamic reflection of the meaning of the chakras. Seven abstract images reflecting the elements, created with a characteristic and scrupulous attitude to the uses of mythological attributes, were linked into a media form - the story that evolves human energy into technological achievement.","uk":"Співпраця з Lenovo — це творчий експеримент, у якому можливості цифрових інструментів використовуються для перетворення статичної картини на динамічне відображення сенсу інноваційного продукту. Сім абстрактних зображень, що відображають елементи, створені з характерним і скрупульозним ставленням до використання міфологічних атрибутів, були пов'язані в медіа-форму – історію, яка перетворює людську енергію на технологічні досягнення."}]},{"kind":"works","title":{"en":"","uk":""},"works":[{"image":"830da7_3abe937905b74918a989045af447a08c~mv2.jpg","title":{"en":"","uk":""},"technique":{"en":"digital painting","uk":"цифровий живопис"},"year":"2019","description":{"en":"","uk":""}}]}]},{"slug":"sound","label":{"uk":"Non Verbal Art","en":"Non Verbal Art"},"subtitle":{"en":"","uk":""},"lead":{"uk":"","en":""},"cover":"830da7_2e6ba619e5664d53a4d639fb935c38ef~mv2.png","intro":[{"en":"collaboration with a Ukrainian musician Andriy Kovalevskiy, who works in such genres as experimental electronic music, modern academic music, sound art, and field sound recording, has proceeded on for more than a year. As music and painting evolved - we changed our approaches to the tasks and styles of the projects, that the first project was accompanied by three sound compositions at the same time, and it was my first graphic combined with colour.","uk":"Колаборація з українським музикантом Андрієм Ковалевським, який працює в таких жанрах, як експериментальна електронна музика, сучасна академічна музика, саунд-арт і польові записи звуку, триває понад рік. Коли музика і живопис розвивалися, ми змінювали підходи до завдань і стилів проєктів: перший проєкт супроводжувався одразу трьома звуковими композиціями, і це була моя перша графіка, поєднана з кольором."},{"en":"Andriy Kovalevskiy","uk":"Андрій Ковалевський"},{"en":"@@soundNote","uk":"@@soundNote"}],"blocks":[{"kind":"works","title":{"en":"","uk":""},"works":[{"image":"830da7_b3a428ef8fc24218be6e64f2832fe866~mv2.jpg","title":{"en":"the cup missed the hit","uk":"чашка пропустила удар"},"technique":{"en":"acrylic, oils, whitewashing, watercolor, canvas. 150×100","uk":"акрил, олія, побілка, акварель, полотно. 150×100"},"year":"2022","description":{"en":"","uk":""}}]},{"kind":"photos","title":{"en":"l l art","uk":"l l art"},"photos":["830da7_c66d3ffbcd3248ec9d92733860962824~mv2.jpg","830da7_2e6ba619e5664d53a4d639fb935c38ef~mv2.png","830da7_466ffd01856943e5b4af5f84295b5297~mv2.jpg","830da7_dfc440b8159f484c911fd1b0dbd7b4e4~mv2.jpg","830da7_6ac1354c06ed45849b85a1a4914474d8~mv2.jpg"]}]}],"cv":{"name":{"en":"Mattilda Mariia Zvolinska","uk":"Матильда Марія Зволінська"},"groups":[{"title":{"en":"expositions","uk":"експозиції"},"items":[{"year":"2022","place":{"en":"Bruges, Belgium","uk":"Брюгге, Бельгія"},"what":{"en":"Participation in the exposition","uk":"Участь в експозиції"},"detail":{"en":"\"Ukrainian art week\"","uk":"«Український мистецький тиждень»"}},{"year":"2022","place":{"en":"Vinistu, Estonia","uk":"Віністу, Естонія"},"what":{"en":"Exhibition on territory of \"Viinistu Art Museum\"","uk":"Виставка на території «Художнього музею Війністу»"},"detail":{"en":"\"Is this reality?\"","uk":"«Це реальність?»"}},{"year":"2020","place":{"en":"Odesa, Ukraine","uk":"Одеса, Україна"},"w     <span class="label">${esc(t('nav.about'))}</span>
    <h1 class="cv-name">${esc(tt(DATA.cv.name))}</h1>
    <p class="label sec-sub">${esc(tt(DATA.site.hero.role))} · ${esc(tt(c.city))}</p>
    <div class="sec-intro"><p class="rv">${esc(t('aboutBrief'))}</p></div>
  </section>
  ${early.length ? `<section class="wrap">
    <div class="txt-blk" style="padding-top:0"><h3 class="rv">${esc(t('earlyLabel'))}</h3>
      <p class="rv">${esc(t('earlyNote'))}</p></div>
    ${worksGrid({ works: early }, 'about-early', 0)}
  </section>` : ''}
  <section class="wrap cv-groups">${groups}</section>
  <section class="wrap" style="padding-block:var(--s6)">
    <h2 class="d3 rv" style="margin-bottom:10px">${esc(t('contactsLabel'))}</h2>
    <div class="ct-rows">
      <div class="ct-row"><span class="label">${esc(t('cityLabel'))}</span><div class="ct-v">${esc(tt(c.city))}</div></div>
      <div class="ct-row"><span class="label">${esc(t('emailLabel'))}</span>
        <a class="ct-v" href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>
      <div class="ct-row"><span class="label">${esc(t('instagramLabel'))}</span>
        <a class="ct-v" href="${esc(c.instagramUrl)}" target="_blank" rel="noopener">${esc(c.instagram)}</a></div>
    </div>
  </section>
  ${prevNext(idx)}
  </div>`;
}
function pageNotFound() {
  return `<div class="page"><section class="wrap sec-head">
    <span class="label">404</span><h1 class="d2">${esc(t('nav.home'))}</h1>
    <p class="sec-intro" style="margin-top:24px"><a class="lnk" href="#/">${esc(tt(DATA.site.brand))}</a></p>
  </section></div>`;
}

/* ---------- lightbox ---------- */
function openLB(works, idx) {
  if (!works.length) return;
  S.lb = { works, idx };
  document.body.style.overflow = 'hidden';
  document.getElementById('lb').hidden = false;
  drawLB();
}
function drawLB() {
  const { works, idx } = S.lb;
  const w = works[idx];
  const el = document.getElementById('lb');
  const img = document.getElementById('lbImg');
  const cap = document.getElementById('lbCap');
  document.getElementById('lbCount').textContent = (idx + 1) + ' / ' + works.length;
  const title = tt(w.title) || t('untitled');
  if (w.image && srcOf(w.image)) {
    img.style.display = '';
    img.onerror = () => { img.onerror = null; img.src = srcOf(w.image); };
    img.src = fullOf(w.image);
    img.alt = title;
  } else {
    img.style.display = 'none';
  }
  cap.innerHTML = `<div><div class="lb-t">${esc(title)}</div>
      ${tt(w.description) ? `<div class="lb-d">${esc(tt(w.description))}</div>` : ''}</div>
    <div class="lb-m">${esc(tt(w.technique))}${w.year ? (tt(w.technique) ? ' · ' : '') + esc(w.year) : ''}</div>`;
  const multi = works.length > 1 && works.some((x) => x.image && srcOf(x.image));
  document.getElementById('lbPrev').style.display = multi ? '' : 'none';
  document.getElementById('lbNext').style.display = multi ? '' : 'none';
  el.dataset.idx = idx;
}
function closeLB() {
  S.lb = null;
  document.getElementById('lb').hidden = true;
  document.body.style.overflow = '';
}
function stepLB(d) {
  if (!S.lb) return;
  S.lb.idx = (S.lb.idx + d + S.lb.works.length) % S.lb.works.length;
  drawLB();
}

/* ---------- reveal ---------- */
let io = null;
function initReveal() {
  if (io) io.disconnect();
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.rv').forEach((el) => el.classList.add('in'));
    return;
  }
  io = new IntersectionObserver((ents) => {
    ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
  document.querySelectorAll('.rv').forEach((el, i) => {
    el.style.transitionDelay = (Math.min(i, 8) * 55) + 'ms';
    io.observe(el);
  });
}

/* ---------- router ---------- */
const SLUG_REDIRECT = {
  illustration: 'graphic', collaborations: 'exhibition', performance: 'exhibition',
  cv: 'about', contacts: 'about', early: 'about',
};
function parseHash(raw) {
  let h = (raw == null ? location.hash : raw).replace(/^#\/?/, '').split('?')[0].replace(/\/$/, '');
  h = SLUG_REDIRECT[h] || h;
  if (!h) return { name: 'home' };
  if (h === 'about') return { name: 'about' };
  if (h === 'admin') return { name: 'admin' };
  const sec = DATA.sections.find((s) => s.slug === h);
  if (sec) return { name: 'section', slug: h };
  return { name: 'notfound' };
}
function render(route) {
  const keep = window.scrollY;
  S.route = route || (S.stale ? parseHash(S.stale) : parseHash());
  const app = document.getElementById('app');
  document.documentElement.lang = LANG;
  if (S.route.name === 'home') app.innerHTML = pageHome();
  else if (S.route.name === 'section') {
    const idx = DATA.sections.findIndex((s) => s.slug === S.route.slug);
    app.innerHTML = pageSection(DATA.sections[idx], idx);
  } else if (S.route.name === 'about') app.innerHTML = pageAbout();
  else if (S.route.name === 'admin') { renderAdmin(); }
  else app.innerHTML = pageNotFound();
  if (S.route.name !== 'admin') {
    renderFooter();
    const sec = S.route.name === 'section' ? DATA.sections.find((s) => s.slug === S.route.slug) : null;
    document.title = tt(DATA.site.brand) + (sec ? ' — ' + tt(sec.label) :
      (S.route.name === 'about' ? ' — ' + t('nav.about') : ''));
  } else {
    document.title = tt(DATA.site.brand) + ' — ' + t('admin.loginTitle');
  }
  renderNav();
  closeMenu();
  initReveal();
  if (S.route.name === 'admin') { /* admin restores its own scroll */ }
  else window.scrollTo(0, S.route.name === 'home' ? 0 : Math.min(keep, 40));
  bindPage();
}
function renderFooter() {
  const yr = new Date().getFullYear();
  const nav = navList().map((i) => `<a href="#/${i.slug}">${esc(i.label)}</a>`).join('');
  document.getElementById('ftr').innerHTML = `<div class="ftr-in">
    <div class="ftr-top"><span class="d3">${esc(tt(DATA.site.brand))}</span><nav class="ftr-nav">${nav}</nav></div>
    <div class="ftr-bot"><span>© ${yr} ${esc(tt(DATA.site.brand))}. ${esc(t('rights'))}</span>
      <a class="adm-lnk" href="#/admin">${esc(t('artistLogin'))}</a></div></div>`;
}
function bindPage() {
  document.querySelectorAll('.works').forEach((grid) => {
    let works = null;
    if (grid.dataset.sec === 'about-early') works = DATA.cv.early;
    else {
      const sec = DATA.sections.find((s) => s.slug === grid.dataset.sec);
      const block = sec ? sec.blocks[+grid.dataset.blk] : null;
      works = block && block.works;
    }
    if (!works) return;
    grid.querySelectorAll('[data-lb]').forEach((f) => {
      const open = () => openLB(works, parseInt(f.dataset.lb, 10));
      f.addEventListener('click', open);
      f.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
  });
}

/* ---------- menu / lang / global events ---------- */
function closeMenu() {
  document.getElementById('menu').hidden = true;
  document.getElementById('burger').setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}
function setLang(l) {
  LANG = l;
  store.set(LS_LANG, l);
  render();
}

/* ---------- theme ---------- */
function applyTheme(th) {
  if (th !== 'dark' && th !== 'light') th = 'light';
  document.documentElement.dataset.theme = th;
  document.querySelectorAll('[data-theme-btn]').forEach((b) => {
    b.setAttribute('aria-pressed', String(th === 'dark'));
    b.title = th === 'dark' ? (LANG === 'uk' ? 'Світла тема' : 'Light theme')
                            : (LANG === 'uk' ? 'Темна тема' : 'Dark theme');
  });
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set(LS_THEME, next);
  applyTheme(next);
}

/* in-app previews can hijack link clicks and block URL changes — navigate ourselves */
function go(hash) {
  if (location.hash === hash) { render(); return; }
  try { location.hash = hash; } catch (e) { /* restricted viewer */ }
  if (location.hash !== hash) { S.stale = hash; render(parseHash(hash)); }
}
window.addEventListener('hashchange', () => { S.stale = null; render(); });
document.addEventListener('click', (e) => {
  const tb = e.target.closest('[data-theme-btn]');
  if (tb) { toggleTheme(); return; }
  const lb = e.target.closest('[data-lang]');
  if (lb) { setLang(lb.dataset.lang); return; }
  if (e.target.closest('#burger')) {
    const m = document.getElementById('menu');
    const open = m.hidden;
    m.hidden = !open;
    document.getElementById('burger').setAttribute('aria-expanded', String(open));
    document.body.style.overflow = open ? 'hidden' : '';
    return;
  }
  const nav = e.target.closest('a[href^="#"]');
  if (nav) {
    if (nav.closest('#menu')) closeMenu();
    e.preventDefault();
    go(nav.getAttribute('href'));
    return;
  }
  if (e.target.closest('#lbX')) { closeLB(); return; }
  if (e.target.closest('#lbPrev')) { stepLB(-1); return; }
  if (e.target.closest('#lbNext')) { stepLB(1); return; }
  if (e.target.id === 'lb') { closeLB(); return; }
});
document.addEventListener('keydown', (e) => {
  if (!S.lb) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') stepLB(-1);
  if (e.key === 'ArrowRight') stepLB(1);
});

/* theme boot: stored choice, else system preference (no-flash init already ran in <head>) */
applyTheme(store.get(LS_THEME) ||
  (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

</script>
<script>
/* ============================================================
   Mattilda Zvolinska — admin panel (#/admin)
   ============================================================ */
'use strict';

let adminTab = 'sections';
let uplTarget = null;   // {path, mode:'list'|'single'}

async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
}
function pwHash() { return store.get(LS_PW) || DATA.passwordHash || ''; }
function isAdmin() { return sstore.get(SS_ADMIN) === '1'; }

/* ---------- small field builders ---------- */
function inp(path, val, ta) {
  val = val == null ? '' : val;
  return ta
    ? `<textarea class="in" data-path="${esc(path)}">${esc(val)}</textarea>`
    : `<input class="in" data-path="${esc(path)}" value="${esc(val)}">`;
}
function bi(label, path, obj, ta) {
  obj = obj || {};
  return `<div class="fld"><span class="fld-l">${esc(label)}</span><div class="row2">
    <div><span class="fld-l" style="color:var(--ember)">EN</span>${inp(path + '.en', obj.en, ta)}</div>
    <div><span class="fld-l" style="color:var(--ember)">UA</span>${inp(path + '.uk', obj.uk, ta)}</div>
  </div></div>`;
}
function mono(label, path, val) {
  return `<div class="fld"><span class="fld-l">${esc(label)}</span>${inp(path, val)}</div>`;
}
function btns(arr) {
  return arr.map((b) => `<button type="button" class="${b.cls || 'ibtn'}" data-act="${b.act}" ` +
    Object.entries(b.data || {}).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ') +
    ` title="${esc(b.title || '')}">${b.icon}</button>`).join('');
}
const UP = (act, data, title) => ({ act, data, title, icon: '↑' });
const DN = (act, data, title) => ({ act, data, title, icon: '↓' });
const DEL = (act, data, title) => ({ act, data, title, icon: '✕', cls: 'ibtn del' });

/* ---------- sections tab ---------- */
function worksEditor(si, bji) {
  const b = DATA.sections[si].blocks[bji];
  const items = (b.works || []).map((wk, k) => {
    const isCover = wk.image && DATA.sections[si].cover === wk.image;
    return `<div class="adm-card">
      <div class="ac-head">
        ${wk.image && srcOf(wk.image) ? `<img class="thumb" style="width:64px;height:64px;object-fit:cover;border:1px solid var(--line)" src="${srcOf(wk.image)}" alt="">` : ''}
        <span class="ac-title">${esc(tt(wk.title) || '—')}</span>
        ${btns([
          UP('work-up', { i: si, j: bji, k }), DN('work-down', { i: si, j: bji, k }),
          { act: 'work-cover', data: { i: si, j: bji, k }, icon: '★', title: t('admin.setCover') },
          wk.image ? { act: 'work-img-del', data: { i: si, j: bji, k }, icon: '⌫', title: t('admin.removeImage') } : null,
          DEL('work-del', { i: si, j: bji, k }, t('admin.delete')),
        ].filter(Boolean))}
      </div>
      ${isCover ? `<div class="adm-note">${esc(t('admin.isCover'))}</div>` : ''}
      ${bi(t('admin.workTitle'), `sections[${si}].blocks[${bji}].works[${k}].title`, wk.title)}
      ${bi(t('admin.workTechnique'), `sections[${si}].blocks[${bji}].works[${k}].technique`, wk.technique)}
      <div class="row2">${mono(t('admin.workYear'), `sections[${si}].blocks[${bji}].works[${k}].year`, wk.year)}</div>
      ${bi(t('admin.workDescription'), `sections[${si}].blocks[${bji}].works[${k}].description`, wk.description, true)}
      <button type="button" class="btn btn-ghost btn-sm" data-upl="single" data-path="sections[${si}].blocks[${bji}].works[${k}].image">
        ${wk.image ? '↻' : '↑'} ${esc(t('admin.uploadImages'))}</button>
    </div>`;
  }).join('');
  return `<div>${items}
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button type="button" class="btn btn-sm" data-act="work-add" data-i="${si}" data-j="${bji}">+ ${esc(t('admin.addWork'))}</button>
      <button type="button" class="btn btn-ghost btn-sm" data-upl="list" data-path="sections[${si}].blocks[${bji}].works">↑ ${esc(t('admin.uploadImages'))}</button>
    </div></div>`;
}
function photosEditor(si, bji) {
  const b = DATA.sections[si].blocks[bji];
  const thumbs = (b.photos || []).map((p, k) =>
    `<div class="thumb"><img src="${srcOf(p)}" alt=""><div class="th-ops">
      <button type="button" data-act="photo-up" data-i="${si}" data-j="${bji}" data-k="${k}" title="${esc(t('admin.moveUp'))}">↑</button>
      <button type="button" data-act="photo-down" data-i="${si}" data-j="${bji}" data-k="${k}" title="${esc(t('admin.moveDown'))}">↓</button>
      <button type="button" data-act="photo-del" data-i="${si}" data-j="${bji}" data-k="${k}" title="${esc(t('admin.delete'))}">✕</button>
    </div></div>`).join('');
  return `<div class="thumbs">${thumbs}</div>
    <button type="button" class="btn btn-ghost btn-sm" data-upl="list" data-path="sections[${si}].blocks[${bji}].photos">↑ ${esc(t('admin.uploadImages'))}</button>`;
}
function blockEditor(si, b, bji) {
  const kindLbl = { works: t('admin.works'), photos: t('admin.photos'), text: 'text', links: 'links' }[b.kind] || b.kind;
  let inner = '';
  if (b.kind === 'works') inner = worksEditor(si, bji);
  else if (b.kind === 'photos') inner = photosEditor(si, bji);
  else if (b.kind === 'text') {
    inner = (b.paras || []).map((p, k) =>
      `<div class="adm-card"><div class="ac-head"><span class="ac-title">¶ ${k + 1}</span>
        ${btns([DEL('para-del', { i: si, j: bji, k })])}</div>
        ${bi(t('admin.blockText'), `sections[${si}].blocks[${bji}].paras[${k}]`, p, true)}</div>`).join('') +
      `<button type="button" class="btn btn-ghost btn-sm" data-act="para-add" data-i="${si}" data-j="${bji}">+ ${esc(t('admin.addParagraph'))}</button>`;
  } else if (b.kind === 'links') {
    inner = (b.items || []).map((l, k) =>
      `<div class="adm-card"><div class="ac-head"><span class="ac-title">${esc(tt(l.label) || '—')}</span>
        ${btns([DEL('lnk-del', { i: si, j: bji, k })])}</div>
        ${bi(t('admin.blockTitle'), `sections[${si}].blocks[${bji}].items[${k}].label`, l.label)}
        ${mono('URL', `sections[${si}].blocks[${bji}].items[${k}].url`, l.url)}</div>`).join('') +
      `<button type="button" class="btn btn-ghost btn-sm" data-act="lnk-add" data-i="${si}" data-j="${bji}">+ link</button>`;
  }
  return `<div class="adm-card">
    <div class="ac-head"><span class="blk-kind">${esc(b.kind)} · ${esc(kindLbl)}</span>
      ${btns([UP('blk-up', { i: si, j: bji }), DN('blk-down', { i: si, j: bji }), DEL('blk-del', { i: si, j: bji }, t('admin.delete'))])}</div>
    ${bi(t('admin.blockTitle'), `sections[${si}].blocks[${bji}].title`, b.title)}
    ${inner}</div>`;
}
function sectionEditor(s, si) {
  const intro = (s.intro || []).map((p, k) =>
    `<div class="adm-card"><div class="ac-head"><span class="ac-title">¶ ${k + 1}</span>
      ${btns([DEL('intro-del', { i: si, k })])}</div>

    <div class="ac-head">
      <span class="ac-title">${esc(tt(s.label))} <small style="color:var(--stone)">/${esc(s.slug)}</small></span>
      ${btns([UP('sec-up', { i: si }), DN('sec-down', { i: si }), DEL('sec-del', { i: si }, t('admin.delete'))])}

    ${bi(t('admin.label'), `sections[${si}].label`, s.label)}
    ${bi(t('admin.sectionSubtitle'), `sections[${si}].subtitle`, s.subtitle)}
    ${bi(t('admin.lead'), `sections[${si}].lead`, s.lead)}
    ${mono(t('admin.slug'), `sections[${si}].slug`, s.slug)}

    <div class="fld"><span class="fld-l">${esc(t('admin.blocks'))}</span></div>${blocks}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      <button type="button" class="btn btn-ghost btn-sm" data-act="blk-add" data-kind="works" data-i="${si}">+ ${esc(t('admin.addWorksBlock'))}</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="blk-add" data-kind="photos" data-i="${si}">+ ${esc(t('admin.addPhotosBlock'))}</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="blk-add" data-kind="text" data-i="${si}">+ ${esc(t('admin.addTextBlock'))}</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="blk-add" data-kind="links" data-i="${si}">+ ${esc(t('admin.addLinksBlock'))}</button>
    </div></div>`;
}
function tabSections() {
  const secs = DATA.sections.map((s, si) => sectionEditor(s, si)).join('');
  return `<div class="adm-note">${esc(t('admin.sectionsIntro'))}<br>${esc(t('admin.langFields'))}</div>
    ${secs}<button type="button" class="btn" data-act="sec-add">+ ${esc(t('admin.addSection'))}</button>`;

/* ---------- home tab ---------- */
function tabHome() {
  const h = DATA.site.hero;
  const stmt = (DATA.site.statement || []).map((p, k) =>
    `<div class="adm-card"><div class="ac-head"><span class="ac-title">¶ ${k + 1}</span>

      ${bi(t('admin.statementParas'), `site.statement[${k}]`, p, true)}</div>`).join('');
  const cards = DATA.site.cards.map((c, k) => {
    const opts = DATA.sections.map((s) =>
      `<option value="${esc(s.slug)}" ${c.section === s.slug ? 'selected' : ''}>${esc(tt(s.label))}</option>`).join('');
    return `<div class="adm-card"><div class="ac-head">

      <span class="ac-title">${esc(tt(c.title) || '—')}</span>
